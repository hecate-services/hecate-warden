# Elvis lint + eunit for hecate-warden.
#
# GitHub is canonical (since 2026-07-26). Keeps the org's structural rules
# honest: no deep nesting (max one meaningful level), no nested try/catch,
# no if.
name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: erlang:27
    steps:
      - uses: actions/checkout@v4
      # hecate_om 0.15.0 made barrel_docdb (RocksDB-backed) a hard
      # dependency -- its erocksdb NIF needs cmake + a C++ toolchain to
      # build, neither of which the base erlang:27 image ships. Without
      # this, `rebar3 lint`/`rebar3 eunit` fail at "cmake: not found"
      # the moment any dependency on hecate_om >= 0.15 lands here.
      - name: Install native build toolchain (RocksDB via barrel_docdb)
        run: apt-get update && apt-get install -y cmake build-essential
      - name: Elvis lint
        run: rebar3 lint
      - name: EUnit
        run: rebar3 eunit
