# Build the OCI image for hecate-warden and push to ghcr.io.
#
# GitHub is canonical (since 2026-07-26). Triggered on push to main and on tag
# pushes. A push to main publishes :latest, which is what watchtower on the
# public boxes polls for — so merging here IS the deploy.

name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']
    # A push that touches only operator scripts or docs must not rebuild
    # :latest -- watchtower would roll every warden on the fleet for nothing.
    paths-ignore:
      - 'scripts/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hecate-services/hecate-warden:latest
            ghcr.io/hecate-services/hecate-warden:${{ steps.tag.outputs.tag }}
